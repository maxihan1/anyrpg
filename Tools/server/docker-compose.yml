# AnyMMO 헤드리스 게임 서버 — 앱은 wss://anyrpg.maxihan.com:443(Caddy)으로 붙고, 서버는 anyrpg-api 를 HTTPS 로 부른다
# 클라우드(모두의 AI)가 UDP 를 못 열어 FishNet 전송을 Bayou(WebSocket)로 바꿨다 — 7770 은 Caddy 만 닿게 127.0.0.1 에만 연다
# runtime-deps 이미지는 Unity 플레이어가 쓰는 glibc · CA 인증서가 들어 있어 Dockerfile 이 필요 없다
services:
  game:
    image: mcr.microsoft.com/dotnet/runtime-deps:8.0
    container_name: anyrpg-game
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./server:/app
    env_file: .env
    command: ["./AnyMMOServer.x86_64", "-batchmode", "-nographics", "-logFile", "-", "--servermode", "MMO", "--serverport", "7770"]
    ports:
      - "127.0.0.1:7770:7770"
